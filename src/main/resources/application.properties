# =========================
# Database
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketbridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================
# File Upload
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:${user.home}/marketbridge-uploads}

# =========================
# Email
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Application URL
# =========================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =========================
# Security
# =========================
app.expose-dev-reset-link=${EXPOSE_DEV_RESET_LINK:false}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080}

# =========================
# Server
# =========================
server.port=${PORT:8080}

# =========================
# Error Response
# =========================
server.error.include-message=always
