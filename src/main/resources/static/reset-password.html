<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
    </div>
</nav>

<div class="auth-wrap">
    <div class="auth-card">
        <h1>Set a new password</h1>
        <p class="sub">Choose a new password for your account.</p>

        <div class="alert alert-error" id="errorBox"></div>
        <div class="alert alert-success" id="successBox"></div>

        <form id="resetForm">
            <div class="field">
                <label>New password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
            </div>
            <div class="field">
                <label>Confirm new password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Reset password</button>
        </form>

        <p class="auth-foot"><a href="login.html">Back to login</a></p>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
