<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html" class="active">Categories</a>
            <a href="cart.html">Cart<span class="nav-badge" id="cartBadge" style="display:none;">0</span></a>
            <a href="seller-dashboard.html">Sell</a>
            <a href="community.html">Community</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="about.html">About</a>
        </div>
        <div class="nav-user" id="guestLinks">
            <a href="login.html" class="btn btn-outline btn-sm">Log in</a>
            <a href="register.html" class="btn btn-primary btn-sm">Sign up</a>
        </div>
        <div class="nav-user" id="userLinks" style="display:none;">
            <div class="user-menu">
                <button type="button" class="user-chip"><span class="avatar" id="navAvatar"></span><span id="navUserName"></span></button>
                <div class="user-menu-panel">
                    <a href="buyer-dashboard.html">My Orders</a>
                    <a href="seller-dashboard.html">My Listings</a>
                    <a href="#" onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="section container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">›</span><span id="crumbCurrent">Categories</span></div>

    <div class="section-head">
        <div><p class="section-kicker">BROWSE</p><h2 id="pageTitle">All products</h2></div>
    </div>

    <div class="search-bar" style="margin-bottom:26px; max-width:100%;">
        <input type="text" id="searchInput" placeholder="Search for anything...">
        <button class="btn btn-primary" onclick="applyFilters()">Search</button>
    </div>

    <div class="browse-layout">
        <aside class="filter-panel">
            <div class="filter-group">
                <h4>Category</h4>
                <div id="categoryFilters"></div>
            </div>
            <div class="filter-group">
                <h4>Price Range (৳)</h4>
                <div class="filter-range">
                    <input type="number" id="minPriceInput" placeholder="Min">
                    <span>–</span>
                    <input type="number" id="maxPriceInput" placeholder="Max">
                </div>
            </div>
            <div class="filter-group">
                <h4>Condition</h4>
                <div id="conditionFilters">
                    <label class="filter-check"><input type="checkbox" value="NEW"> New</label>
                    <label class="filter-check"><input type="checkbox" value="LIKE_NEW"> Like New</label>
                    <label class="filter-check"><input type="checkbox" value="GOOD"> Good</label>
                    <label class="filter-check"><input type="checkbox" value="USED"> Used</label>
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="applyFilters()">Apply Filters</button>
            <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="clearFilters()">Clear All</button>
        </aside>

        <div>
            <div class="results-head">
                <span class="results-count" id="resultsCount">Loading…</span>
                <select id="sortSelect" class="sort-select" onchange="applyFilters()">
                    <option value="newest">Sort: Newest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="name_asc">Name: A-Z</option>
                </select>
            </div>

            <div id="productGrid" class="grid"></div>
            <div id="emptyState" class="empty" style="display:none;">
                <div class="icon">🔍</div>
                <p>No products match these filters.</p>
            </div>
            <div id="paginationBar" style="display:flex; gap:6px; justify-content:center; margin-top:26px;"></div>
        </div>
    </div>
</main>

<script src="js/app.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
