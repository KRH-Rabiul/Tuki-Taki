<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussion - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">Cart<span class="nav-badge" id="cartBadge" style="display:none;">0</span></a>
            <a href="seller-dashboard.html">Sell</a>
            <a href="community.html" class="active">Community</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="about.html">About</a>
        </div>
        <div class="nav-user" id="guestLinks">
            <a href="login.html" class="btn btn-outline btn-sm">Log in</a>
            <a href="register.html" class="btn btn-primary btn-sm">Sign up</a>
        </div>
        <div class="nav-user" id="userLinks" style="display:none;">
            <div class="user-menu">
                <button type="button" class="user-chip"><span class="avatar" id="navAvatar"></span><span id="navUserName"></span></button>
                <div class="user-menu-panel">
                    <a href="profile.html">My Profile</a>
                    <a href="notifications.html">Notifications</a>
                    <a href="buyer-dashboard.html">My Orders</a>
                    <a href="seller-shop.html" data-my-shop-link>My Shop</a>
                    <a href="messages.html">Messages</a>
                    <a href="#" onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="section container community-page">
    <a href="community.html" class="text-button">← Back to Community</a>

    <div id="postDetail" class="community-post-detail card">Loading discussion…</div>

    <div class="section-head" style="margin-top:28px;">
        <div><div class="section-kicker">DISCUSSION</div><h2 id="replyHeading">Replies</h2></div>
    </div>

    <div id="replyFormWrap" class="card" style="display:none;">
        <div class="card-body">
            <form id="replyForm">
                <textarea id="replyBody" rows="3" maxlength="2000" placeholder="Write a reply..." required></textarea>
                <div id="replyError" class="alert alert-error" style="display:none;"></div>
                <div style="margin-top:10px; text-align:right;">
                    <button class="btn btn-primary" type="submit">Send reply</button>
                </div>
            </form>
        </div>
    </div>
    <div id="loginToReply" class="card" style="display:none;">
        <div class="card-body login-to-reply-row">
            <span class="text-muted">Log in to join this campus conversation.</span>
            <a href="login.html" class="btn btn-primary btn-sm">Log in to reply</a>
        </div>
    </div>

    <div id="replyList" class="community-reply-list"></div>
</main>

<script src="js/app.js"></script>
<script src="js/community.js"></script>
</body>
</html>
