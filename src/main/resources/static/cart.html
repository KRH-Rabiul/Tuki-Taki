<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html" class="active">Cart<span class="nav-badge" id="cartBadge" style="display:none;">0</span></a>
            <a href="seller-dashboard.html">Sell</a>
            <a href="community.html">Community</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="about.html">About</a>
        </div>
        <div class="nav-user" id="guestLinks">
            <a href="login.html" class="btn btn-outline btn-sm">Log in</a>
            <a href="register.html" class="btn btn-primary btn-sm">Sign up</a>
        </div>
        <div class="nav-user" id="userLinks" style="display:none;">
            <div class="user-menu">
                <button type="button" class="user-chip"><span class="avatar" id="navAvatar"></span><span id="navUserName"></span></button>
                <div class="user-menu-panel">
                    <a href="buyer-dashboard.html">My Orders</a>
                    <a href="seller-dashboard.html">My Listings</a>
                    <a href="#" onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="section container" style="max-width:700px;">
    <h1>Your Cart</h1>

    <div class="alert alert-error" id="cartError"></div>
    <div id="cartSuccess" style="display:none; margin-bottom:16px;"></div>

    <div id="cartItems"></div>
    <div id="cartEmpty" class="empty" style="display:none;">
        <div class="icon">🛒</div>
        <p>Your cart is empty.</p>
        <a href="categories.html" class="btn btn-primary" style="margin-top:12px;">Browse products</a>
    </div>

    <div id="cartCheckout" style="margin-top:24px;"></div>
</main>

<script src="js/app.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
