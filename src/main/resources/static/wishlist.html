<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">Cart<span class="nav-badge" id="cartBadge" style="display:none;">0</span></a>
            <a href="seller-dashboard.html">Sell</a>
            <a href="community.html">Community</a>
            <a href="wishlist.html" class="active">Wishlist</a>
            <a href="about.html">About</a>
        </div>
        <div class="nav-user">
            <div class="user-menu">
                <button type="button" class="user-chip"><span class="avatar" id="navAvatar"></span><span id="navUserName"></span></button>
                <div class="user-menu-panel">
                    <a href="buyer-dashboard.html">My Orders</a>
                    <a href="#" onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="section container">
    <h1>Your Wishlist</h1>
    <div id="wishGrid" class="grid" style="margin-top:20px;"></div>
    <div id="wishEmpty" class="empty" style="display:none;">
        <div class="icon">❤️</div>
        <p>No products in your wishlist yet.</p>
        <a href="categories.html" class="btn btn-primary" style="margin-top:12px;">Browse products</a>
    </div>
</main>

<script src="js/app.js"></script>
<script>
    requireMarketplaceUser();

    async function loadWishlist() {
        const res = await authFetch('/api/wishlist');
        const products = await res.json();

        const grid = document.getElementById('wishGrid');
        const empty = document.getElementById('wishEmpty');
        grid.innerHTML = '';

        if (!products.length) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <a href="product-details.html?id=${p.id}">
                    ${p.imageUrl ? `<img class="card-img" src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}">` : `<div class="card-img placeholder">🛒</div>`}
                    <div class="card-body">
                        <div class="card-cat">${escapeHtml(p.category || 'General')}</div>
                        <h3 class="card-title">${escapeHtml(p.name)}</h3>
                        <div class="card-foot"><span class="price">${p.price}</span></div>
                    </div>
                </a>
                <button class="btn btn-outline btn-sm" style="margin:10px; width:calc(100% - 20px);" onclick="removeFromWishlist(${p.id})">Remove</button>
            `;
            grid.appendChild(card);
        });
    }

    async function removeFromWishlist(productId) {
        await authFetch(`/api/wishlist/${productId}`, { method: 'DELETE' });
        loadWishlist();
    }

    loadWishlist();
</script>
</body>
</html>
