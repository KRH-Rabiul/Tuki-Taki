<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
    </div>
</nav>

<div class="auth-wrap">
    <div class="auth-card">
        <h1>Forgot your password?</h1>
        <p class="sub">Enter the email you registered with and we'll generate a reset link.</p>

        <div class="alert alert-error" id="errorBox"></div>
        <div class="alert alert-success" id="successBox"></div>
        <div class="alert" id="devResetLink" style="display:none; background:#eef6ff; border:1px solid #bcd8ff; color:#1c3d63;"></div>

        <form id="forgotForm">
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>

        <p class="auth-foot">Remembered it? <a href="login.html">Log in</a></p>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
