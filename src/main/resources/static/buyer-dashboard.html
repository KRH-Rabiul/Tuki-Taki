<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Tuki-Taki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="images/logo-light.png" alt="Tuki-Taki - your campus marketplace"><img class="brand-logo brand-logo-dark" src="images/logo-dark.png" alt="Tuki-Taki - your campus marketplace"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">Cart<span class="nav-badge" id="cartBadge" style="display:none;">0</span></a>
            <a href="seller-dashboard.html">Sell</a>
            <a href="community.html">Community</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="about.html">About</a>
        </div>
        <div class="nav-user">
            <div class="user-menu">
                <button type="button" class="user-chip"><span class="avatar" id="navAvatar"></span><span id="navUserName"></span></button>
                <div class="user-menu-panel">
                    <a href="buyer-dashboard.html" class="active">My Orders</a>
                    <a href="seller-dashboard.html">My Listings</a>
                    <a href="#" onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="dash">
    <aside class="sidebar">
        <h3>Account</h3>
        <a class="side-link" href="profile.html">Profile</a>
        <a class="side-link" href="notifications.html">Notifications</a>
        <a class="side-link active" href="buyer-dashboard.html">My Orders</a>
        <a class="side-link" href="wishlist.html">Wishlist</a>
        <a class="side-link" href="seller-shop.html" data-my-shop-link>My Shop</a>
        <a class="side-link" href="seller-dashboard.html">My Listings</a>
        <a class="side-link" href="seller-dashboard.html#orders">Orders Received</a>
        <a class="side-link" href="messages.html">Messages</a>
    </aside>

    <section class="dash-content">
        <div id="tab-orders">
            <div class="section-head"><h2>My Orders</h2></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Pickup point</th>
                            <th>Status</th>
                            <th>Ordered on</th>
                            <th>Pickup code</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>
            <div class="empty" id="emptyOrders" style="display:none;">
                <div class="icon">📦</div>
                <p>No orders yet. <a href="categories.html">Start browsing</a>.</p>
            </div>
        </div>
    </section>
</div>

<script src="js/app.js"></script>
<script src="js/buyer.js"></script>
</body>
</html>
